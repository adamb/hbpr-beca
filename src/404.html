<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Holberton School PR Scholarship</title>
  <link rel="shortcut icon" type="image/x-icon" href="/img/favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Montserrat", system-ui, -apple-system, sans-serif;
      color: #1a1a1a; background: #fff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem; text-align: center;
    }
    .wrap { max-width: 480px; }
    .code { font-size: 6rem; font-weight: 700; color: #df1937; line-height: 1; letter-spacing: -2px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 1rem 0 0.5rem; }
    p { color: #555; line-height: 1.6; margin-bottom: 2rem; }
    a.btn {
      display: inline-block; background: #df1937; color: #fff;
      text-decoration: none; font-weight: 700;
      padding: 0.85rem 1.75rem; border-radius: 6px;
      transition: background 0.15s ease;
    }
    a.btn:hover { background: #b8142c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist. It may have been moved or removed.</p>
    <a class="btn" href="/">Back to Scholarship Home</a>
  </div>
</body>
</html>
